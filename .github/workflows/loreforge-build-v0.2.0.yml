          mkdir -p "$GITHUB_WORKSPACE/restored"
          tar -xJf /tmp/loreforge.tar.xz -C "$GITHUB_WORKSPACE/restored"
          test -f "$GITHUB_WORKSPACE/restored/LoreForgeLocal/settings.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Source privacy checks
        working-directory: restored/LoreForgeLocal
        shell: bash
        run: chmod +x scripts/verify_source_privacy.sh && ./scripts/verify_source_privacy.sh

      - name: Build debug APK
        working-directory: restored/LoreForgeLocal
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK has no INTERNET permission
        shell: bash
        run: |
          APK="$GITHUB_WORKSPACE/restored/LoreForgeLocal/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee /tmp/permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/permissions.txt; then
            echo 'FAIL: INTERNET permission is present in merged APK'
            exit 1
          fi

      - name: Upload ready-to-install APK
        uses: actions/upload-artifact@v4
        with:
          name: LoreForgeLocal-v0.2.0-debug-apk
          path: restored/LoreForgeLocal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
