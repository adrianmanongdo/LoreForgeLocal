name: NullSignal 2.0 APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/nullsignal-v2.yml'
      - '.github/workflows/nullsignal-v2-source.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore NullSignal 2.0 source
        shell: bash
        run: |
          cat .github/workflows/nullsignal-v2-source.part1 \
              .github/workflows/nullsignal-v2-source.part2 \
              .github/workflows/nullsignal-v2-source.part3 \
              .github/workflows/nullsignal-v2-source.part4 \
              .github/workflows/nullsignal-v2-source.part5 \
              .github/workflows/nullsignal-v2-source.part6 \
              .github/workflows/nullsignal-v2-source.part7 \
              .github/workflows/nullsignal-v2-source.part8 > /tmp/nullsignal-v2.b64
          test "$(wc -c < /tmp/nullsignal-v2.b64)" -eq 52336
          base64 -d /tmp/nullsignal-v2.b64 > /tmp/nullsignal-v2.tar.gz
          echo "dbc0cd26b205b5a7f7d5524019a68eb5980fd3d62ee7afc073c5fc75b6fa3c50  /tmp/nullsignal-v2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nullsignal-v2.tar.gz
          test -f NullSignalMVP/settings.gradle

      - name: Build debug APK
        working-directory: NullSignalMVP
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify mobility APK
        shell: bash
        run: |
          APK=NullSignalMVP/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.ACCESS_BACKGROUND_LOCATION" /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.FOREGROUND_SERVICE_LOCATION" /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.ACTIVITY_RECOGNITION" /tmp/nullsignal-v2-permissions.txt
          ! grep -q "android.permission.RECORD_AUDIO" /tmp/nullsignal-v2-permissions.txt
          ! grep -q "android.permission.CAMERA" /tmp/nullsignal-v2-permissions.txt
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NullSignal-2.0.0-APK
          path: NullSignalMVP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
