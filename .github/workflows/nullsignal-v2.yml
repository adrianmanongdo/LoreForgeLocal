name: NullSignal 2.0 APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/nullsignal-v2.yml'
      - '.github/workflows/nullsignal-v2-source.part*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore NullSignal 2.0 source
        shell: bash
        run: |
          echo "332f2711f1f962b76c4a89eb750044b1cec8ebd4a2b6255ce3246ac7e9755f91  .github/workflows/nullsignal-v2-source.part1" | sha256sum -c -
          echo "1aa951c40b9b5a10723d49b8b854faf4cb03ddc49014123abf77149d6d7f770e  .github/workflows/nullsignal-v2-source.part2" | sha256sum -c -
          echo "8d497bf672914a78778d0cfc7bfc7f64af810d5a64342c85c51667cfaf15cc84  .github/workflows/nullsignal-v2-source.part3" | sha256sum -c -
          echo "5a93e9deed6bc074677b99ef499e9c4a2fe0c8af8956dbb77dcc7b0f7c38330d  .github/workflows/nullsignal-v2-source.part4a" | sha256sum -c -
          echo "04a0263bf4539bda6297bb6aedc8aa7eaa07ba8bc3176d88ef743445a0bf5e9d  .github/workflows/nullsignal-v2-source.part4b" | sha256sum -c -
          echo "83be1c0c1b0b875781f957cbc5e5dc5c2fa962bf582699f05ba0778ddb6690a6  .github/workflows/nullsignal-v2-source.part4c" | sha256sum -c -
          echo "b42c3a696516b2bb3aba04df1b1da37673b6eae4949e3adf7373ce6cf44fa9ff  .github/workflows/nullsignal-v2-source.part4d" | sha256sum -c -
          echo "ecb51f73e084201bf01a9f375f08a1e431105ac1b932b32b778402e2058d8021  .github/workflows/nullsignal-v2-source.part5" | sha256sum -c -
          echo "066ea6cf251655779d91b713a468fd81abdebd7fe0018ce2a360f6e683c21a5c  .github/workflows/nullsignal-v2-source.part6" | sha256sum -c -
          echo "4c8bf138b953cf4c77602844cde5c759d73b47cbd90b325a0b36c8d3cca4a0c6  .github/workflows/nullsignal-v2-source.part7" | sha256sum -c -
          echo "04988c871fb102872ceb36460d2eb6c0216ea6bf1ed83dc177577b78596bf384  .github/workflows/nullsignal-v2-source.part8" | sha256sum -c -
          cat .github/workflows/nullsignal-v2-source.part1 \
              .github/workflows/nullsignal-v2-source.part2 \
              .github/workflows/nullsignal-v2-source.part3 \
              .github/workflows/nullsignal-v2-source.part4a \
              .github/workflows/nullsignal-v2-source.part4b \
              .github/workflows/nullsignal-v2-source.part4c \
              .github/workflows/nullsignal-v2-source.part4d \
              .github/workflows/nullsignal-v2-source.part5 \
              .github/workflows/nullsignal-v2-source.part6 \
              .github/workflows/nullsignal-v2-source.part7 \
              .github/workflows/nullsignal-v2-source.part8 > /tmp/nullsignal-v2.b64
          test "$(wc -c < /tmp/nullsignal-v2.b64)" -eq 52336
          echo "aa58de390945dc0059633d57713765b635281c7392e4aa88ab5c24fb9cea8b0a  /tmp/nullsignal-v2.b64" | sha256sum -c -
          base64 -d /tmp/nullsignal-v2.b64 > /tmp/nullsignal-v2.tar.gz
          echo "dbc0cd26b205b5a7f7d5524019a68eb5980fd3d62ee7afc073c5fc75b6fa3c50  /tmp/nullsignal-v2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nullsignal-v2.tar.gz
          test -f NullSignalMVP/settings.gradle

      - name: Build debug APK
        working-directory: NullSignalMVP
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify mobility APK
        shell: bash
        run: |
          APK=NullSignalMVP/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.ACCESS_BACKGROUND_LOCATION" /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.FOREGROUND_SERVICE_LOCATION" /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/nullsignal-v2-permissions.txt
          grep -q "android.permission.ACTIVITY_RECOGNITION" /tmp/nullsignal-v2-permissions.txt
          ! grep -q "android.permission.RECORD_AUDIO" /tmp/nullsignal-v2-permissions.txt
          ! grep -q "android.permission.CAMERA" /tmp/nullsignal-v2-permissions.txt
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NullSignal-2.0.0-APK
          path: NullSignalMVP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
