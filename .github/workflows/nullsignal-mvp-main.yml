name: NullSignal MVP APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/nullsignal-mvp-main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Materialize NullSignal source
        shell: bash
        run: |
          mkdir -p project
          echo '' | base64 -d > source.tar.gz
          tar -xzf source.tar.gz -C project

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: test -f project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NullSignal-MVP-0.1.0-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
