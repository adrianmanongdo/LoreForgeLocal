name: NullSignal 2.0 Compatible APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/nullsignal-v2-compat.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore exact source
        shell: bash
        run: |
          cat .github/workflows/nullsignal-v2-source.part1 \
              .github/workflows/nullsignal-v2-source.part2 \
              .github/workflows/nullsignal-v2-source.part3 \
              .github/workflows/nullsignal-v2-source.part4a \
              .github/workflows/nullsignal-v2-source.part4b \
              .github/workflows/nullsignal-v2-source.part4c \
              .github/workflows/nullsignal-v2-source.part4d \
              .github/workflows/nullsignal-v2-source.part5 \
              .github/workflows/nullsignal-v2-source.part6 \
              .github/workflows/nullsignal-v2-source.part7 \
              .github/workflows/nullsignal-v2-source.part8 > /tmp/nullsignal-v2.b64
          test "$(wc -c < /tmp/nullsignal-v2.b64)" -eq 52336
          echo "aa58de390945dc0059633d57713765b635281c7392e4aa88ab5c24fb9cea8b0a  /tmp/nullsignal-v2.b64" | sha256sum -c -
          base64 -d /tmp/nullsignal-v2.b64 > /tmp/nullsignal-v2.tar.gz
          echo "dbc0cd26b205b5a7f7d5524019a68eb5980fd3d62ee7afc073c5fc75b6fa3c50  /tmp/nullsignal-v2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nullsignal-v2.tar.gz
          sed -i "s/androidx.core:core:1.17.0/androidx.core:core:1.15.0/" NullSignalMVP/app/build.gradle
          grep "androidx.core:core:1.15.0" NullSignalMVP/app/build.gradle

      - name: Build debug APK
        working-directory: NullSignalMVP
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify mobility permissions
        shell: bash
        run: |
          APK=NullSignalMVP/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" /tmp/perms.txt
          grep -q "android.permission.ACCESS_BACKGROUND_LOCATION" /tmp/perms.txt
          grep -q "android.permission.FOREGROUND_SERVICE_LOCATION" /tmp/perms.txt
          grep -q "android.permission.INTERNET" /tmp/perms.txt
          grep -q "android.permission.ACTIVITY_RECOGNITION" /tmp/perms.txt
          ! grep -q "android.permission.RECORD_AUDIO" /tmp/perms.txt
          ! grep -q "android.permission.CAMERA" /tmp/perms.txt
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: NullSignal-2.0.0-APK
          path: NullSignalMVP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
