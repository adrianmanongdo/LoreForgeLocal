name: NullSignal 2.1 Commute APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/nullsignal-2.1.yml'
      - '.github/workflows/nullsignal-2.1-patch-*.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore verified NullSignal 2.0 baseline
        shell: bash
        run: |
          cat .github/workflows/nullsignal-v2-source.part1 \
              .github/workflows/nullsignal-v2-source.part2 \
              .github/workflows/nullsignal-v2-source.part3 \
              .github/workflows/nullsignal-v2-source.part4a \
              .github/workflows/nullsignal-v2-source.part4b \
              .github/workflows/nullsignal-v2-source.part4c \
              .github/workflows/nullsignal-v2-source.part4d \
              .github/workflows/nullsignal-v2-source.part5 \
              .github/workflows/nullsignal-v2-source.part6 \
              .github/workflows/nullsignal-v2-source.part7 \
              .github/workflows/nullsignal-v2-source.part8 > /tmp/nullsignal-v2.b64
          test "$(wc -c < /tmp/nullsignal-v2.b64)" -eq 52336
          echo "aa58de390945dc0059633d57713765b635281c7392e4aa88ab5c24fb9cea8b0a  /tmp/nullsignal-v2.b64" | sha256sum -c -
          base64 -d /tmp/nullsignal-v2.b64 > /tmp/nullsignal-v2.tar.gz
          echo "dbc0cd26b205b5a7f7d5524019a68eb5980fd3d62ee7afc073c5fc75b6fa3c50  /tmp/nullsignal-v2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nullsignal-v2.tar.gz
          test -f NullSignalMVP/settings.gradle

      - name: Apply commute patches
        run: |
          python .github/workflows/nullsignal-2.1-patch-transit.py
          python .github/workflows/nullsignal-2.1-patch-core.py
          python .github/workflows/nullsignal-2.1-patch-store.py
          python .github/workflows/nullsignal-2.1-patch-ui1.py
          python .github/workflows/nullsignal-2.1-patch-ui2.py
          grep -q "versionName '2.1.0'" NullSignalMVP/app/build.gradle
          grep -q 'possible_missed_stop' NullSignalMVP/app/src/main/java/com/nullsignal/local/MobilityEngine.java
          test -f NullSignalMVP/app/src/main/java/com/nullsignal/local/TransitInference.java
          test ! -f NullSignalMVP/app/src/main/java/com/nullsignal/local/ParkingInference.java

      - name: Build APK
        working-directory: NullSignalMVP
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify commute APK
        shell: bash
        run: |
          APK=NullSignalMVP/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee /tmp/perms.txt
          grep -q 'android.permission.ACCESS_FINE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' /tmp/perms.txt
          grep -q 'android.permission.ACTIVITY_RECOGNITION' /tmp/perms.txt
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NullSignal-2.1.0-Commute-APK
          path: NullSignalMVP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
